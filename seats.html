const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(P.iv)},key,un(P.ct));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:un(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
(async()=>{
  const f=document.getElementById('f'),m=document.getElementById('m');
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){f.hidden=false;m.textContent='이 브라우저에서는 열 수 없습니다. 크롬이나 사파리 최신 판으로 열어 주십시오.';return;}
  try{const s=localStorage.getItem(K);if(s){await open(await crypto.subtle.importKey('raw',un(s),'AES-GCM',true,['decrypt']));return;}}catch(e){try{localStorage.removeItem(K);}catch(_){}}
  f.hidden=false;document.getElementById('pw').focus();
  f.onsubmit=async e=>{e.preventDefault();m.textContent='여는 중입니다';
    try{const key=await fromPw(document.getElementById('pw').value.trim());
      const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
      const html=key;await crypto.subtle.decrypt({name:'AES-GCM',iv:un(P.iv)},key,un(P.ct));
      try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}
      await open(html);
    }catch(err){m.textContent='비밀번호가 맞지 않습니다';}};
})();
